name: Integracion continua

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas en Windows
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Instalar el proyecto
        run: python -m pip install -e .

      - name: Estilo (ruff)
        run: ruff check .

      - name: Reglas de importacion
        run: lint-imports

      - name: Pruebas
        run: pytest